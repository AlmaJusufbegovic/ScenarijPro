version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: scenarijpro_db
    restart: always
    networks:
      - scenarijpro-mreza
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: scenarijpro_app
    restart: always
    ports:
      - "3000:3000"
    networks:
      - scenarijpro-mreza
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

networks:
  scenarijpro-mreza:
    name: scenarijpro-mreza
    driver: bridge

volumes:
  mysql_data: